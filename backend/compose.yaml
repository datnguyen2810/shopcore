name: shopcore # tên container

services:
  postgres:
    image: postgres:17-alpine
    container_name: shopcore-postgres
    environment:
      POSTGRES_DB: shopcore
      POSTGRES_USER: shopcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcore_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - shopcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcore -d shopcore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shopcore-postgres-data:
    external: true # yêu cầu sử dụng volume có sẵn, tránh vô tình tạo database trống
    name: backend_shopcore-postgres-data