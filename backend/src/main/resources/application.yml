server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: shopcore-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health,info